##### Core #####
set -g history-limit 10000000
set -g default-shell /opt/homebrew/bin/bash
set -s escape-time 0
set -g focus-events on
set -g renumber-windows on
set -g mouse off
set -g set-clipboard on
# Defaults (750ms) are too short to read a message or pick a pane number.
set -g display-time 2000
set -g display-panes-time 2000

##### Terminal capabilities #####
# tmux-256color, not screen-256color: the screen entry predates italics and
# underline styles, so programs inside a pane silently lose them. Set it
# explicitly rather than relying on the running tmux version's default.
set -g default-terminal "tmux-256color"
# Features of the *outer* terminal (alacritty, which exports xterm-256color).
# Neither 24-bit colour nor styled underlines are claimed by that terminfo
# entry, so without this nvim's truecolor themes get quantised to 256.
set -as terminal-features ",xterm-256color:RGB:usstyle"
set -as terminal-features ",alacritty*:RGB:usstyle"
# Let a program reach the outer terminal directly (image protocols, OSC
# sequences) instead of tmux swallowing the escape sequence.
set -g allow-passthrough on

##### Prefix and reload #####
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### Window and pane navigation #####
bind-key -n F2 new-window -c "#{pane_current_path}"
bind-key -n S-F3 swap-window -d -t -1
bind-key -n S-F4 swap-window -d -t +1
bind-key -n F3 previous-window
bind-key -n F4 next-window
bind-key -n F5 resize-pane -Z
bind-key -n F7 copy-mode

# Split panes using | and -
bind-key | split-window -h -c "#{pane_current_path}"
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind-key '"'
unbind-key %

# Switch panes using Alt ("option" key in macOS) + arrows (no prefix)
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# Resize with shift added to the same arrows; -r repeats so the prefix is
# needed once per burst rather than once per press.
bind-key -n M-S-Left resize-pane -L 5
bind-key -n M-S-Right resize-pane -R 5
bind-key -n M-S-Up resize-pane -U 5
bind-key -n M-S-Down resize-pane -D 5
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Zoomed picker, so a long window list is readable.
bind-key s choose-tree -Zs
bind-key P choose-buffer -Z

##### Copy mode #####
# vi keys are already inferred from EDITOR; state it so the bindings below
# cannot land in the wrong table.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# tmux's set-clipboard already forwards a copy over OSC 52, but that depends on
# the outer terminal honouring it; pbcopy is unconditional on macOS (and needs
# no reattach-to-user-namespace since 10.14).
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel pbcopy
bind-key -T copy-mode-vi Escape send-keys -X cancel

##### Status line #####
# Palette. Segments are distinguished by foreground colour against one shared
# bar background: a row of saturated full-width colour blocks competes with the
# pane content underneath it, which is what the eye is actually reading.
# bin/tmux-status repeats these values at its top -- keep the two in step.
# The greys are true greys: alacritty's background is #000000, so anything
# hue-tinted here reads as a colour cast rather than as a neutral bar.
#   bar  #1c1c1c   dim  #4e4e4e   path #eaeaea
#   blue #7aa2f7   warn #e0af68   ok   #9ece6a   err #f7768e
set -g status-style "bg=#1c1c1c,fg=white"
set -g status-justify left
# Every value in the bar is cached for >=5s by the script below, and there is no
# clock, so nothing here changes faster than this. Halving the tick rate halves
# the per-second work; the prefix and copy-mode indicators are redraw-driven
# rather than interval-driven, so they still react instantly.
set -g status-interval 2
set -g status-right-length 250
# Active pane is otherwise only identifiable by the cursor.
set -g pane-border-style fg=#3a3a3a
set -g pane-active-border-style fg=#7aa2f7

# Session name doubles as the prefix indicator (amber while the prefix is
# pending) and gains a COPY badge in copy mode, replacing tmux-prefix-highlight.
# Colour names/indices, not hex, inside the conditional: a '#' inside #{?...}
# is ambiguous to the format parser, while these never are.
set -g status-left-length 40
set -g status-left "\
#[fg=#{?client_prefix,colour215,white},bold] #S \
#{?pane_in_mode,#[fg=#1c1c1c#,bg=#7dcfff#,bold] COPY #[fg=#4e4e4e#,bg=#1c1c1c#,nobold] ,}\
#[fg=#4e4e4e,nobold]▏"

# Windows: tmux's default format and separator, active window inverted. The
# bar's own fg only reaches the window list -- every other segment sets its own
# colour -- so it stays white to keep the inactive tabs at full contrast.
setw -g window-status-current-style "fg=#000000,bg=white"

# The right-hand segments (path, git, aws, kube, mem, disk, battery) are
# rendered by one script rather than one shell per segment; see bin/tmux-status.
# The path is built there too rather than with #{b:pane_current_path}: it is
# drawn relative to the repo root, which the script already knows and a tmux
# format cannot work out. client_width is passed so the script can drop its
# lower-value segments rather than let tmux eat the window list on a narrow
# client.
set -g status-right "\
#(~/repo/dotfiles/bin/tmux-status \"#{pane_current_path}\" #{client_width})"
